# Render.com deployment configuration for Digital Product Studio FastAPI backend.
# https://render.com/docs/render-yaml
services:
  - type: web
    name: dps-api
    runtime: python
    region: singapore # Closest region to India
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FRONTEND_URL
        value: https://digitalproductstudio.in
      - key: GOOGLE_REDIRECT_URI
        value: https://dps-api.onrender.com/api/auth/google/callback
